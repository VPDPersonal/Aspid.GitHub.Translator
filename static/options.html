<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="icons/icon-32.png">
  <title>Aspid Translator for GitHub</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --border: #d1d9e0; --accent: #0969da; --ok: #1a7f37; --err: #d1242f; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f0f6fc; --muted: #9198a1; --bg: #0d1117; --border: #3d444d; --accent: #4493f8; --ok: #3fb950; --err: #f85149; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { display: flex; gap: 10px; align-items: center; font-size: 20px; margin: 0 0 24px; }
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px 16px; margin: 0 0 16px; }
    legend { padding: 0 6px; font-weight: 600; }
    label { display: block; margin-top: 10px; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    select { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
    .radio, .check { display: flex; gap: 8px; align-items: flex-start; }
    .radio input, .check input { margin-top: 4px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #status { min-height: 21px; margin-top: 12px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #parts .check { margin-top: 6px; }
  </style>
</head>
<body>
<main>
  <h1><img src="icons/icon-48.png" alt="" width="32" height="32"> <span data-i18n="extName"></span></h1>
  <form id="form">
    <fieldset>
      <legend data-i18n="settingsTranslation"></legend>
      <label for="target" data-i18n="settingsTarget"></label>
      <select id="target"></select>
      <label class="check"><input type="checkbox" id="auto"> <span><span data-i18n="settingsAuto"></span><br><span class="hint" data-i18n="settingsAutoHint"></span></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="settingsParts"></legend>
      <div id="parts"></div>
      <p class="hint" data-i18n="settingsPartsHint"></p>
    </fieldset>

    <fieldset>
      <legend data-i18n="settingsEngine"></legend>
      <div id="providers"></div>
    </fieldset>

    <div class="row">
      <button type="submit" class="primary" data-i18n="settingsSave"></button>
    </div>
    <div id="status"></div>
  </form>
</main>
<script src="options.js"></script>
</body>
</html>
