<!doctype html>
<!-- Chrome Web Store marquee promo tile, 1400×560. Rendered by store/render.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="promo.css">
<style>
  body { width: 1400px; height: 560px; }
  .tile { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .brand { gap: 16px; }
  .brand img { width: 108px; height: 108px; margin: -6px 0; }
  .name { font-size: 32px; text-align: left; }
  .head { margin: 40px 0 0; font-size: 68px; }
  .head span { font-size: 37px; margin-top: 8px; }
</style>
</head>
<body>
<div class="tile stage">
  <canvas class="rain"></canvas>
  <div class="brand" data-clear>
    <img src="../../assets/icon-mark.svg" alt="">
    <div class="name"><em>Aspid</em> Translator<br>for GitHub</div>
  </div>
  <h1 class="head" data-clear><strong>Review pull requests</strong><span>in your own language</span></h1>
</div>
<script src="rain.js"></script>
<script>
  window.rendered = drawRain(document.querySelector('.rain'), { scale: 0.8, gap: 1.6, opacity: 0.6, clear: document.querySelectorAll('[data-clear]') });
</script>
</body>
</html>
