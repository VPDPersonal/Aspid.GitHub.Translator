<!doctype html>
<!-- Chrome Web Store small promo tile, 440×280. Rendered by store/render.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="promo.css">
<style>
  body { width: 440px; height: 280px; }
  .tile { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 36px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; filter: drop-shadow(0 6px 14px rgb(0 0 0 / 0.25)); }
  .name { font-size: 25px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .tagline { font-size: 21px; font-weight: 600; line-height: 1.3; opacity: 0.95; }
  .chips { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="tile bg">
  <div class="brand">
    <img src="../../assets/icon.svg" alt="">
    <div class="name">Aspid Lingo<br>for GitHub</div>
  </div>
  <div class="tagline">Review pull requests<br>in your own language</div>
  <div class="chips"><span class="chip">Free</span><span class="chip">On-device</span><span class="chip">Private</span></div>
</div>
</body>
</html>
