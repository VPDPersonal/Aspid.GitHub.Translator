<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <title>Aspid Lingo for GitHub</title>
  <style>
    /* The Aspid "Venom" theme of the Aspid sites, with its default green accent. */
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8; --panel: #ffffff; --hair: #e3e4e8; --line: #d3d5db;
      --fg: #2a2c31; --strong: #121316; --muted: #5f636b;
      --accent: #1d8840; --fill: #1d8840; --ink: #ffffff; --deep: #177035;
      --shadow: 0 18px 48px -16px rgb(18 19 22 / 0.3);
      --serif: 'IBM Plex Serif', ui-serif, Georgia, serif;
      --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0b0f; --panel: #10121a; --hair: #1c1f28; --line: #272b35;
        --fg: #c8c8cc; --strong: #f0f0f2; --muted: #92959f;
        --accent: #5cb46b; --fill: #5cb46b; --ink: #06140a; --deep: #357a42;
        --shadow: 0 18px 48px -16px rgb(0 0 0 / 0.7);
      }
    }
    body {
      margin: 0; color: var(--fg); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
      background: var(--bg) radial-gradient(circle, color-mix(in srgb, var(--muted) 14%, transparent) 1px, transparent 1.2px) fixed;
      background-size: 20px 20px;
    }
    main { max-width: 640px; margin: 0 auto; padding: 56px 20px 120px; display: flex; flex-direction: column; gap: 36px; }
    header { display: flex; align-items: center; gap: 18px; }
    header img { flex: none; }
    h1 { margin: 0; font: 600 30px/1.15 var(--serif); letter-spacing: -0.01em; color: var(--strong); }
    h1 .brand { color: var(--accent); }
    .tagline { margin: 6px 0 0; color: var(--muted); text-wrap: pretty; }
    form, section, .groups, .group { display: flex; flex-direction: column; }
    form { gap: 36px; }
    section, .groups { gap: 12px; }
    .group { gap: 6px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    h2 { margin: 0; font: 600 19px/1.3 var(--serif); color: var(--strong); }
    h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--strong); }
    .count { font: 12px/1.5 var(--mono); color: var(--muted); }
    .card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
    .icon { flex: none; color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; box-sizing: border-box; min-height: 48px; padding: 10px 16px; }
    .card-head ~ .row { padding-inline-start: 42px; }
    label.row { flex-wrap: nowrap; cursor: pointer; }
    label.row:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
    .divider { height: 1px; margin-inline-start: 16px; background: var(--hair); }
    .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .hint { color: var(--muted); font-size: 13px; text-wrap: pretty; }
    .group > .hint { margin: 0 16px; }
    .select { position: relative; display: flex; align-items: center; }
    .select svg { position: absolute; inset-inline-end: 12px; pointer-events: none; color: var(--muted); }
    select {
      appearance: none; box-sizing: border-box; height: 38px; padding-block: 0; padding-inline: 12px 36px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--bg); color: var(--strong); font: inherit; font-weight: 500; cursor: pointer;
    }
    /* Off: an outline that keeps 3:1 against the card; on: the accent fill with its ink, like the sites' filled marks. */
    .switch {
      appearance: none; flex: none; position: relative; box-sizing: border-box; width: 42px; height: 24px; margin: 0;
      border: 1.5px solid var(--muted); border-radius: 999px; background: transparent; cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .switch::before {
      content: ''; position: absolute; top: 3.5px; inset-inline-start: 3.5px; width: 14px; height: 14px; border-radius: 50%;
      background: var(--muted); transition: transform 0.15s, background-color 0.15s;
    }
    .switch:checked { border-color: var(--fill); background: var(--fill); }
    .switch:checked::before { background: var(--ink); transform: translateX(18px); }
    .switch:checked:dir(rtl)::before { transform: translateX(-18px); }
    .provider { flex-wrap: nowrap; justify-content: flex-start; gap: 12px; padding: 16px; }
    .provider + .provider { border-top: 1px solid var(--hair); }
    .provider input { margin: 0; accent-color: var(--accent); }
    .provider:has(input[hidden]) { cursor: default; }
    .provider:has(input[hidden]):hover { background: none; }
    .provider .name { font-weight: 600; color: var(--strong); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; display: flex; align-items: center; gap: 10px;
      box-sizing: border-box; max-width: calc(100% - 32px); padding: 12px 16px;
      border: 1px solid var(--deep); border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, var(--panel));
      color: var(--strong); box-shadow: var(--shadow); font-size: 14px;
      translate: -50% 12px; opacity: 0; pointer-events: none; transition: opacity 0.2s, translate 0.2s;
    }
    .toast.shown { translate: -50% 0; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .switch, .switch::before, .toast { transition: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon.svg" alt="" width="64" height="64">
    <div>
      <!-- The name is the same in every language; "Aspid" carries the accent, as on the Aspid sites. -->
      <h1><span class="brand">Aspid</span> Lingo for GitHub</h1>
      <p class="tagline" data-i18n="extDescription"></p>
    </div>
  </header>

  <form id="form">
    <section>
      <h2 data-i18n="settingsTranslation"></h2>
      <div class="card">
        <div class="row">
          <label for="target" data-i18n="settingsTarget"></label>
          <div class="select">
            <select id="target"></select>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="divider"></div>
        <label class="row">
          <span class="text"><span data-i18n="settingsAuto"></span><span class="hint" data-i18n="settingsAutoHint"></span></span>
          <input type="checkbox" role="switch" class="switch" id="auto">
        </label>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2 data-i18n="settingsParts"></h2>
        <span class="count" id="count"></span>
      </div>
      <div class="groups">
        <div class="group">
          <div class="card">
            <div class="card-head">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7"/><path d="M18 15.5V9a3 3 0 0 0-3-3h-4"/><path d="M13 3.5 10.5 6 13 8.5"/></svg>
              <h3 data-i18n="settingsGroupPr"></h3>
            </div>
            <label class="row"><span data-i18n="partPrTitle"></span><input type="checkbox" role="switch" class="switch" data-part="prTitle"></label>
            <label class="row"><span data-i18n="partPrBody"></span><input type="checkbox" role="switch" class="switch" data-part="prBody"></label>
            <label class="row"><span data-i18n="partComments"></span><input type="checkbox" role="switch" class="switch" data-part="comments"></label>
            <label class="row"><span data-i18n="partReviewComments"></span><input type="checkbox" role="switch" class="switch" data-part="reviewComments"></label>
          </div>
        </div>
        <div class="group">
          <div class="card">
            <div class="card-head">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></svg>
              <h3 data-i18n="settingsGroupCommits"></h3>
            </div>
            <label class="row"><span data-i18n="partCommitTitles"></span><input type="checkbox" role="switch" class="switch" data-part="commitTitles"></label>
            <label class="row"><span data-i18n="partCommitBodies"></span><input type="checkbox" role="switch" class="switch" data-part="commitBodies"></label>
          </div>
          <p class="hint" data-i18n="settingsCommitsHint"></p>
        </div>
        <div class="group">
          <div class="card">
            <div class="card-head">
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
              <h3 data-i18n="settingsGroupFiles"></h3>
            </div>
            <label class="row"><span data-i18n="partReadme"></span><input type="checkbox" role="switch" class="switch" data-part="readme"></label>
          </div>
          <p class="hint" data-i18n="settingsFilesHint"></p>
        </div>
      </div>
    </section>

    <section>
      <h2 data-i18n="settingsEngine"></h2>
      <div class="card" id="providers"></div>
    </section>
  </form>
</main>

<template id="provider-row">
  <label class="row provider">
    <input type="radio" name="provider">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>
    <span class="name"></span>
  </label>
</template>

<div class="toast" id="toast" role="status">
  <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <span id="toast-text"></span>
</div>
<script src="options.js"></script>
</body>
</html>
